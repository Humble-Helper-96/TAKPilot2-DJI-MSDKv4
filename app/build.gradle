apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

repositories {
    mavenLocal()
}

// Release signing credentials, kept OUT of git. Create app/keystore.properties from
// keystore.properties.example and fill it in; without it the release build still runs and simply
// produces an unsigned APK, so a fresh clone (and anyone we hand the source to) builds fine.
def keystorePropsFile = rootProject.file('app/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// DJI SDK registration key, kept OUT of git — it's registered to this exact applicationId (see
// the DO NOT CHANGE note below) and shouldn't be public. Create app/dji-key.properties from
// dji-key.properties.example and fill it in; without it the manifest placeholder resolves to an
// empty string and the SDK registration call fails fast with a clear error, rather than the build
// silently breaking.
def djiKeyPropsFile = rootProject.file('app/dji-key.properties')
def djiKeyProps = new Properties()
if (djiKeyPropsFile.exists()) {
    djiKeyPropsFile.withInputStream { djiKeyProps.load(it) }
}

android {
    compileSdkVersion 33
    useLibrary 'org.apache.http.legacy'

    signingConfigs {
        release {
            // Guarded so the block is only populated when the properties file is present —
            // referencing a null storeFile fails configuration for EVERY task, including debug.
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        // DO NOT CHANGE. The DJI API key in AndroidManifest.xml is registered against this exact
        // applicationId, not the manifest package — a suffix, flavor or side-by-side variant
        // breaks aircraft registration outright. See docs/TAKPILOT2_V4_PORT_PLAN.md.
        applicationId "com.anchortak.takpilot2gov4"
        minSdkVersion 23
        targetSdkVersion 34
        multiDexEnabled true
        // versionCode is a purely internal Android integer. It exists so `install -r` can tell
        // one build is newer than another. Bump it on EVERY build you put on a device. It is not
        // shown in the UI — the home screen shows versionName and BUILD_TIME instead, which is
        // what makes "which APK is on the aircraft" answerable.
        //
        // versionName is real semver and is what TAKPilot reports to the TAK server as
        // <takv version>, so it is visible in the server's Connected Users panel. Bump it when
        // what goes on the wire changes, not only when the UI does.
        //
        // History:  1.0 first release  ·  1.1.0 Autel-parity pass (taklite core, UI, features)
        //           1.2.0 the Autel v1.6.2 pass — server-held channels, two video servers, a
        //                 codec choice, the Pre-Flight rearrangement and the Field Guide cut
        //           1.2.1 a second Field Guide cut, 3813 words to 3033. Documentation only —
        //                 no code and nothing on the wire changed, thus the patch number.
        //           1.2.2 the team-dot rendering, from the main merge: a live TAK client draws
        //                 as a dot, not a 2525 marker frame. First release cut from main after
        //                 device-compat was merged and deleted.
        //           1.2.3 com.taklite synced to the taklite-core master — the tree's conformance
        //                 pass (check-taklite.sh CONFORMS, three pinned waivers). On the wire:
        //                 UTF-8 pinned on send, one FIFO sender thread so two CoT can no longer
        //                 interleave into one document, a carried decoder so a non-ASCII callsign
        //                 split across two reads is no longer mojibake, the marker type escaped,
        //                 the feed password redacted from the log. Takes the Autel v2.1.6
        //                 CotParser.isUasReport rule (a UAS says so with <vehicle>/<_uastool>;
        //                 the type cannot tell it from ADS-B) — parsed and held on TakUser.uas,
        //                 NOT yet drawn: the 2525 air frame is Autel-only until the spec has it.
        //                 No UI change. Not flown.
        //           1.2.4 an AR edge arrow reaches the picture's edge — ledger D23. The clamp
        //                 subtracted the HUD column's width from the video's right edge; on this
        //                 phone the column sits over the pillarbox strip and never covered the
        //                 picture, so the right arrow stopped 150dp short (measured 2026-09-14,
        //                 1530px against a picture ending at 1920). Now: intersect with the view
        //                 (§4.1 MUST), exclude the toolbar band and the mini-map BY CORNER from
        //                 its measured bounds, nothing else. The contacts log says where the
        //                 last arrow landed. Nothing on the wire changed. Not flown.
        //           1.2.5 the HUD says which media mode the camera is in — ledger D22. A glyph
        //                 and a word between the EV scale and the clock, amber "? MODE" until the
        //                 camera answers, read off the SystemState push the bridge already owns.
        //                 The RC-N1's switch and shutter move the camera without the app being
        //                 asked and the picture changes shape with it; this is the explanation.
        //                 Paid for: the aircraft position line leaves the telemetry block and
        //                 MSL recedes to the reference size (§4.4). Column re-measured. Not flown.
        //           1.2.6 the record pill follows the camera's mode — ledger D25. In stills it
        //                 is the still-camera symbol alone and a tap takes a photo with no mode
        //                 change; in video it is the dot and REC as before. Bench-measured first:
        //                 the RC-N1's photo/video toggle moves the camera and leaves it there,
        //                 with nothing from this application. Recording start/stop is now a log
        //                 line. Not flown.
        //           1.2.7 THE BENCH DIAGNOSTICS for the RC-N1's shutter/record button, which
        //                 beeps and does nothing the camera reports. The bridge now logs the SD
        //                 card state on change, every new media file, a still being shot or
        //                 stored, and — taking the RC HardwareState slot on purpose, see the
        //                 bridge — every controller button the phone hears. No UI change.
        //           1.2.8 ONE PRESS OF THE RC-N1's RECORD BUTTON RECORDS — ledger D26. The
        //                 diagnostics showed the phone hears the press and the aircraft waits
        //                 for the app; now the press goes through the REC pill's own path, start
        //                 and stop, in video mode only. In photo mode the camera shoots natively
        //                 and the app stays out of it. Not flown.
        //           1.2.9 THE CAMERA SAYS WHAT IT DID, in the notice under the toolbar: "Photo
        //                 Saved" when the FILE lands on the card, "Recording Started" and
        //                 "Recording Stopped" on the camera's own recording edge — so the
        //                 hardware buttons get the same words as the pills. The four mid-screen
        //                 Toasts that said "saved" on the shutter callback are gone; a refusal
        //                 is a notice in the refused style. Not flown.
        //           1.2.10 THE COLUMN REACHES THE PICTURE (operator, 2026-09-14). The map and the
        //                 EV slider are 137dp wide, not 110: the 16:9 picture ends 30dp short of
        //                 where the map began, and that strip was black. The map's height stays
        //                 128dp — a 137x128 rectangle, the 18dp bought by the RTH/HOME/FAA
        //                 lines losing their margins and font padding, and 12dp more from the
        //                 column's bottom padding so the map's bottom edge lines up with the
        //                 picture's. Measured on the phone: about 10px left in the column. Not flown.
        //           1.2.11 FOUR OPERATOR CALLS ON THE PHONE (2026-09-14): the mini-map's marks are
        //                 a third smaller, the EV slider reaches the picture, the on-screen
        //                 shutter pill is GONE (the RC-N1's buttons and the REC-as-shutter pill
        //                 cover it), and the toolbar is a quarter shorter — 45dp — with the 14dp
        //                 that frees spent on the map (154dp tall). Measured. Not flown.
        //           1.2.12 AR, 1X, LIVE and REC share one text size and one gap; the RTH
        //                 long-press is a MENU — Cancel Return while returning, Cancel Landing
        //                 while landing, Reset Home Point always — ported from Autel v2.1.4, no
        //                 confirmation on the cancels, verified against the aircraft's state
        //                 1.5 s later. Not flown.
        //           1.2.13 THE WARNING BANNER OPENS ON A TAP AND CLOSES ON A ✕ — the two §4.8
        //                 slots, ported from the Autel tree (v1.7.6). Open: every warning on its
        //                 own line, worst first, the aircraft's faults one by one. The ✕ hides
        //                 ONE SET of faults, never the banner — a change to the live set brings
        //                 it back. The banner row draws above the crosshair and takes the touch.
        //                 Banner size moved to per-device dimens. Not flown.
        //           1.2.14 startGoHome IS VERIFIED AGAINST THE AIRCRAFT. Hovering at the altitude
        //                 limit 3 m from home, the call came back "timed out" and the aircraft
        //                 never moved; the callback is the SDK's word, the aircraft's state is
        //                 the truth, read 1.5 s later and told to the pilot both ways. The bridge
        //                 logs every flight-mode / going-home change. Not flown.
        //           1.2.15 the mode-change line compares VALUES: the SDK reuses one state object,
        //                 so v1.2.14's line never fired. Logging only. Flight-tested 2026-09-14:
        //                 RTH verified, Cancel Return verified, the banner in every §4.8 state;
        //                 OPEN: startGoHome times out after a cancelGoHome in the same process.
        //           1.2.16 RTH SAYS WHAT WAS MEASURED (ledger D29): inside 20 m of home nothing
        //                 starts a return on either route, so the tap says so and does not send;
        //                 farther out startGoHome reached the aircraft 2 times in 7 while the
        //                 RC-N1's button went 3 in 3, so a miss is retried once through
        //                 KeyManager START_GO_HOME and a second miss tells the pilot to use the
        //                 controller's button. The "after a cancel" reading is withdrawn.
        //           1.2.17 THE HOME CARD IS THE PRE-FLIGHT CHECK (operator, 2026-09-14; the Autel
        //                 tree's v2.1.1 to v2.1.5). The logo leaves the card; four checks — APP
        //                 PERMISSIONS (tappable when denied), WIFI, TAK, MEDIA SERVER (an RTSP
        //                 OPTIONS probe every 10 s) — then the aircraft: model, SDK, the LIVE
        //                 charge of aircraft and RC, signal-loss behaviour and control response
        //                 as the aircraft holds them, sticks, SD card, and a pulsing INITIALIZING
        //                 that refuses taps for 5 s after the aircraft appears. Not flown.
        //           1.2.18 PRE-FLIGHT GAINS SECTION 0, MEMORY CARD (the Autel tree's v1.7.3): the
        //                 card's state and free space of total as the camera reports them, and a
        //                 Format Card button refused with a named reason (no aircraft, flying,
        //                 recording, no card, write protected, formatting). The format result is
        //                 the camera's answer; the card state says when it finished. A real
        //                 format has NOT been run. Not flown.
        //           1.2.19 THE BRIDGE ARMS ITS AIRCRAFT CALLBACKS WHEN THE AIRCRAFT ARRIVES, from
        //                 the tick by object identity, and the flight screen no longer stops the
        //                 process-wide bridge on the way out — the home card and Pre-Flight
        //                 read it. The battery lock locks the battery levels only. Not flown.
        //           2.0.0 RELEASED (operator, 2026-09-14). The seventeen small updates of the
        //                 bench day, 1.2.3 to 1.2.19, drawn into one release. A MAJOR bump and
        //                 not an eighteenth patch: the flight screen changed shape (the capsule
        //                 toolbar at 45dp, six pills, the media-mode readout, the record pill as
        //                 a shutter, the AR arrows to the picture's edge, the widened column and
        //                 map), the home card became the pre-flight check, Pre-Flight gained the
        //                 memory card, and the RC-N1's record and RTH buttons do what they say.
        //                 versionName is what a TAK server's Connected Users panel shows, and
        //                 1.2.x -> 2.0.0 says the application changed, where 1.2.19 says a bug
        //                 was fixed. The detail is in the 1.2.x blocks above and is not repeated.
        //                 Flown on 2026-09-14 across five short flights: the warning banner,
        //                 RTH and Cancel Return, the media-mode readout and the record pill, the
        //                 RC-N1 record button. NOT flown: the KeyManager RTH retry, a card format.
        // The Autel sibling has its own number line. Do not chase it — they are different apps
        // with different feature sets and one operator who has to tell them apart.
        versionCode 32
        versionName "2.0.0"
        // Stamped at configure time so any sideloaded APK can be identified exactly. This matters
        // in a debugging session where a dozen builds go on the same phone in an afternoon.
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm')}\""
        manifestPlaceholders = [djiApiKey: djiKeyProps['DJI_API_KEY'] ?: '']
        ndk {
            // On x86 devices that run Android API 23 or above, if the application is targeted with API 23 or
            // above, FFmpeg lib might lead to runtime crashes or warnings.
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }

    //需要直接使用appbundle的话，需要强制配置shrinkResources为false
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attached when keystore.properties exists; otherwise the release APK comes out
            // unsigned rather than the build failing.
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    packagingOptions {
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        doNotStrip "*/*/libDJIFlySafeCore.so"
        doNotStrip "*/*/libdjifs_jni.so"
        doNotStrip "*/*/libsfjni.so"
        doNotStrip "*/*/libDJICommonJNI.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core.so"
        doNotStrip "*/*/libAMapSDK_MAP_v6_9_2.so"
        doNotStrip "*/*/libDJIMOP.so"
        doNotStrip "*/*/libDJISDKLOGJNI.so"
        exclude 'META-INF/rxjava.properties'
        exclude 'assets/location_map_gps_locked.png'
        exclude 'assets/location_map_gps_3d.png'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Unit tests over the pure-logic core. returnDefaultValues lets those tests run code that
    // touches android.util.Log (AppLog forwards there) without a device or a mock framework.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Names the artifact for the version it holds, so an APK handed to a pilot identifies itself
// without an install: TAKPilot2-DJI_1.1.0-dev-release.apk. Set on the base plugin after the
// android block — `project.ext.set("archivesBaseName", …)` only creates an extra property with
// that name and leaves the real one alone, which is why the APK stayed "app-release.apk".
archivesBaseName = "TAKPilot2-DJI_" + android.defaultConfig.versionName

dependencies {
    // Unit tests for the pure-logic core — flight-record formats, warning policy, CoT XML,
    // conversions. See app/src/test.
    testImplementation 'junit:junit:4.13.2'
    // NO DJI ARTIFACT HERE, AND IT IS NOT AN OVERSIGHT. The SDK enums (FlightMode,
    // GPSSignalLevel, …) exist only in dji-sdk-provided, which ships STUB bytecode — its
    // constructors return before calling super, so loading one in a JVM test throws
    // VerifyError. The real implementations arrive from the SDK on the device and are not in
    // the aar. Unit tests here therefore stay clear of SDK types; anything that must reason
    // about them is verified on the aircraft. Adding the provided jar back will look like it
    // works until a test actually touches an enum constant.

    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'com.squareup:otto:1.3.8'
    implementation('com.dji:dji-sdk:4.18', {
        /**
         * Uncomment the "library-anti-distortion" if your app does not need Anti Distortion for Mavic 2 Pro and Mavic 2 Zoom.
         * Uncomment the "fly-safe-database" if you need database for release, or we will download it when DJISDKManager.getInstance().registerApp
         * is called.
         * Both will greatly reducing the size of the APK.
         */
        exclude module: 'library-anti-distortion'
        //exclude module: 'fly-safe-database'
    })
    compileOnly 'com.dji:dji-sdk-provided:4.18'

    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.core:core:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0-rc01'
    implementation 'androidx.annotation:annotation:1.0.0'
    implementation 'com.jakewharton:butterknife:10.0.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'
    implementation "androidx.core:core-ktx:1.6.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.0.0-rc01"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.9"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9"
    implementation 'com.google.android.gms:play-services:11.8.0'

    // Terrain (DTED) import tracking — imports/import_tiles tables, see TerrainDatabase.kt.
    // Pinned to 2.2.6, not the newer 2.4.x: room-runtime 2.4.x embeds Kotlin metadata compiled
    // against Kotlin 1.6+ ("compiled with an incompatible version of Kotlin") that this
    // project's Kotlin 1.5.10 compiler can't read, even without room-ktx. 2.2.6 predates that
    // and has everything this DAO needs (plain blocking calls, no Flow/suspend surface).
    implementation "androidx.room:room-runtime:2.2.6"
    kapt "androidx.room:room-compiler:2.2.6"

    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"

    implementation 'com.google.guava:guava:29.0-android'
    implementation 'org.apache.commons:commons-math3:3.6.1'

    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.4'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'

    // TAKPilot2 Go: map for the custom flight screen (Phase 3).
    // Excludes MapLibre's transitive androidx.fragment (pulls in 1.5.5, which drags in
    // androidx.lifecycle:lifecycle-viewmodel 2.5.1 — duplicate-class conflicts with the
    // project's pinned lifecycle-viewmodel-ktx 2.3.1/2.0.0-rc01, which bundles its own
    // copy of classes now inlined in the newer core artifact).
    implementation('org.maplibre.gl:android-sdk:9.6.0') {
        exclude group: 'androidx.lifecycle'
        exclude group: 'androidx.fragment'
        // MapLibre's optional telemetry pulls a modern Play Services Places artifact that
        // duplicate-class conflicts with this project's ancient play-services:11.8.0 bundle.
        exclude group: 'com.google.android.gms'
    }
}