apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

repositories {
    mavenLocal()
}

// Release signing credentials, kept OUT of git. Create app/keystore.properties from
// keystore.properties.example and fill it in; without it the release build still runs and simply
// produces an unsigned APK, so a fresh clone (and anyone we hand the source to) builds fine.
def keystorePropsFile = rootProject.file('app/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// DJI SDK registration key, kept OUT of git — it's registered to this exact applicationId (see
// the DO NOT CHANGE note below) and shouldn't be public. Create app/dji-key.properties from
// dji-key.properties.example and fill it in; without it the manifest placeholder resolves to an
// empty string and the SDK registration call fails fast with a clear error, rather than the build
// silently breaking.
def djiKeyPropsFile = rootProject.file('app/dji-key.properties')
def djiKeyProps = new Properties()
if (djiKeyPropsFile.exists()) {
    djiKeyPropsFile.withInputStream { djiKeyProps.load(it) }
}

android {
    compileSdkVersion 33
    useLibrary 'org.apache.http.legacy'

    signingConfigs {
        release {
            // Guarded so the block is only populated when the properties file is present —
            // referencing a null storeFile fails configuration for EVERY task, including debug.
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        // DO NOT CHANGE. The DJI API key in AndroidManifest.xml is registered against this exact
        // applicationId, not the manifest package — a suffix, flavor or side-by-side variant
        // breaks aircraft registration outright. See docs/TAKPILOT2_V4_PORT_PLAN.md.
        applicationId "com.anchortak.takpilot2gov4"
        minSdkVersion 23
        targetSdkVersion 34
        multiDexEnabled true
        // versionCode is a purely internal Android integer. It exists so `install -r` can tell
        // one build is newer than another. Bump it on EVERY build you put on a device. It is not
        // shown in the UI — the home screen shows versionName and BUILD_TIME instead, which is
        // what makes "which APK is on the aircraft" answerable.
        //
        // versionName is real semver and is what TAKPilot reports to the TAK server as
        // <takv version>, so it is visible in the server's Connected Users panel. Bump it when
        // what goes on the wire changes, not only when the UI does.
        //
        // History:  1.0 first release  ·  1.1.0 Autel-parity pass (taklite core, UI, features)
        //           1.2.0 channels, by the method a TAK server accepts (server-side scoping,
        //                 no <dest group>), plus the live-client map symbol
        // The Autel sibling has its own number line. Do not chase it — they are different apps
        // with different feature sets and one operator who has to tell them apart.
        versionCode 6
        // -dev because the channels have NOT flown on this airframe. They were built and proved
        // on the Autel tree, which says nothing about a DJI aircraft. It becomes 1.2.0 when a
        // sortie has confirmed it, the same way 1.1.0-dev became 1.1.0.
        versionName "1.2.0-dev"
        // Stamped at configure time so any sideloaded APK can be identified exactly. This matters
        // in a debugging session where a dozen builds go on the same phone in an afternoon.
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm')}\""
        manifestPlaceholders = [djiApiKey: djiKeyProps['DJI_API_KEY'] ?: '']
        ndk {
            // On x86 devices that run Android API 23 or above, if the application is targeted with API 23 or
            // above, FFmpeg lib might lead to runtime crashes or warnings.
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }

    //需要直接使用appbundle的话，需要强制配置shrinkResources为false
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attached when keystore.properties exists; otherwise the release APK comes out
            // unsigned rather than the build failing.
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    packagingOptions {
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        doNotStrip "*/*/libDJIFlySafeCore.so"
        doNotStrip "*/*/libdjifs_jni.so"
        doNotStrip "*/*/libsfjni.so"
        doNotStrip "*/*/libDJICommonJNI.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core.so"
        doNotStrip "*/*/libAMapSDK_MAP_v6_9_2.so"
        doNotStrip "*/*/libDJIMOP.so"
        doNotStrip "*/*/libDJISDKLOGJNI.so"
        exclude 'META-INF/rxjava.properties'
        exclude 'assets/location_map_gps_locked.png'
        exclude 'assets/location_map_gps_3d.png'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Unit tests over the pure-logic core. returnDefaultValues lets those tests run code that
    // touches android.util.Log (AppLog forwards there) without a device or a mock framework.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Names the artifact for the version it holds, so an APK handed to a pilot identifies itself
// without an install: TAKPilot2-DJI_1.1.0-dev-release.apk. Set on the base plugin after the
// android block — `project.ext.set("archivesBaseName", …)` only creates an extra property with
// that name and leaves the real one alone, which is why the APK stayed "app-release.apk".
archivesBaseName = "TAKPilot2-DJI_" + android.defaultConfig.versionName

dependencies {
    // Unit tests for the pure-logic core — flight-record formats, warning policy, CoT XML,
    // conversions. See app/src/test.
    testImplementation 'junit:junit:4.13.2'
    // NO DJI ARTIFACT HERE, AND IT IS NOT AN OVERSIGHT. The SDK enums (FlightMode,
    // GPSSignalLevel, …) exist only in dji-sdk-provided, which ships STUB bytecode — its
    // constructors return before calling super, so loading one in a JVM test throws
    // VerifyError. The real implementations arrive from the SDK on the device and are not in
    // the aar. Unit tests here therefore stay clear of SDK types; anything that must reason
    // about them is verified on the aircraft. Adding the provided jar back will look like it
    // works until a test actually touches an enum constant.

    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'com.squareup:otto:1.3.8'
    implementation('com.dji:dji-sdk:4.18', {
        /**
         * Uncomment the "library-anti-distortion" if your app does not need Anti Distortion for Mavic 2 Pro and Mavic 2 Zoom.
         * Uncomment the "fly-safe-database" if you need database for release, or we will download it when DJISDKManager.getInstance().registerApp
         * is called.
         * Both will greatly reducing the size of the APK.
         */
        exclude module: 'library-anti-distortion'
        //exclude module: 'fly-safe-database'
    })
    compileOnly 'com.dji:dji-sdk-provided:4.18'

    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.core:core:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0-rc01'
    implementation 'androidx.annotation:annotation:1.0.0'
    implementation 'com.jakewharton:butterknife:10.0.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'
    implementation "androidx.core:core-ktx:1.6.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.0.0-rc01"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.9"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9"
    implementation 'com.google.android.gms:play-services:11.8.0'

    // Terrain (DTED) import tracking — imports/import_tiles tables, see TerrainDatabase.kt.
    // Pinned to 2.2.6, not the newer 2.4.x: room-runtime 2.4.x embeds Kotlin metadata compiled
    // against Kotlin 1.6+ ("compiled with an incompatible version of Kotlin") that this
    // project's Kotlin 1.5.10 compiler can't read, even without room-ktx. 2.2.6 predates that
    // and has everything this DAO needs (plain blocking calls, no Flow/suspend surface).
    implementation "androidx.room:room-runtime:2.2.6"
    kapt "androidx.room:room-compiler:2.2.6"

    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"

    implementation 'com.google.guava:guava:29.0-android'
    implementation 'org.apache.commons:commons-math3:3.6.1'

    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.4'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'

    // TAKPilot2 Go: map for the custom flight screen (Phase 3).
    // Excludes MapLibre's transitive androidx.fragment (pulls in 1.5.5, which drags in
    // androidx.lifecycle:lifecycle-viewmodel 2.5.1 — duplicate-class conflicts with the
    // project's pinned lifecycle-viewmodel-ktx 2.3.1/2.0.0-rc01, which bundles its own
    // copy of classes now inlined in the newer core artifact).
    implementation('org.maplibre.gl:android-sdk:9.6.0') {
        exclude group: 'androidx.lifecycle'
        exclude group: 'androidx.fragment'
        // MapLibre's optional telemetry pulls a modern Play Services Places artifact that
        // duplicate-class conflicts with this project's ancient play-services:11.8.0 bundle.
        exclude group: 'com.google.android.gms'
    }
}