# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
android.injected.testOnly=false
# ⚠ -XX:MaxPermSize WAS HERE AND IT STOPPED THE BUILD DEAD.
# The permanent generation went in Java 8. A modern JVM rejects the option and REFUSES TO
# START, thus the Gradle daemon never came up and every task failed before it began.
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError

# ⚠ THIS PROJECT NEEDS JAVA 11. It does not build on Java 17.
#
# Gradle 6.7.1 is older than Java 17, and the kapt of this Kotlin version cannot reach into
# jdk.compiler on 17: "module jdk.compiler does not export com.sun.tools.javac.util".
# --add-opens does not correct it, because kapt runs in its own worker process.
#
# This path is for THIS machine. On another machine, change it or take the line out and set
# JAVA_HOME to a Java 11 before the build. To be rid of the line, move to Gradle 7 or later —
# a bigger change, because the old DJI SDK, kapt and butterknife all have to agree.
org.gradle.java.home=/usr/lib/jvm/java-11-openjdk-amd64
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
